services:
  - type: web
    name: future-cinema-api
    runtime: node
    region: frankfurt
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: XPAY_SECRET_KEY
        sync: false
      - key: XPAY_PUBLIC_KEY
        sync: false
      - key: XPAY_WEBHOOK_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
    healthCheckPath: /api/health
    disk:
      name: future-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
