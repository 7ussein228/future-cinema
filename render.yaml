services:
  # ——— Backend API (Express + file DB) ———
  - type: web
    name: future-cinema-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: XPAY_SECRET_KEY
        sync: false # ضيف sk_live_... في Render Dashboard بعد أول Deploy
      - key: XPAY_PUBLIC_KEY
        sync: false
      - key: XPAY_WEBHOOK_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://future-cinema-client.onrender.com
      - key: PUBLIC_URL
        value: https://future-cinema-api.onrender.com
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: future-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1

  # ——— Frontend (Vite) ———
  - type: web
    name: future-cinema-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://future-cinema-api.onrender.com
      - key: NODE_VERSION
        value: 20
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
